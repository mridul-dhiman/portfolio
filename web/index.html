  <style>
    /* The single most common reason a Flutter portfolio reads as broken is the
       default blank white flash before the engine boots. This is that gap,
       styled on purpose: paper ground, one blinking ink cursor, centred. */
    @font-face {
      font-family: 'JetBrainsMono';
      src: url('fonts/JetBrainsMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ink: #0A0A0A;
      --paper: #FAFAF7;
      --fg: var(--ink);
      --bg: var(--paper);
    }

    @media (prefers-color-scheme: dark) {
      :root { --fg: var(--paper); --bg: var(--ink); }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'JetBrainsMono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    #boot span {
      display: block;
      width: 0.6em;
      height: 1em;
      font-size: 32px;
      background: var(--fg);
      animation: blink 1060ms steps(1, end) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot span { animation: none; }
    }
  </style>

  <!-- Without JS the boot cursor never gets removed, and it would sit on top
       of the noscript fallback forever. -->
  <noscript><style>#boot { display: none; }</style></noscript>
</head>
<body>
  <div id="boot" role="status" aria-label="loading"><span></span></div>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      config: {
        // CanvasKit explicitly, served from the copy `flutter build web`
        // writes into build/web/canvaskit/ rather than from gstatic.com at
        // runtime. Relative so it resolves against the base href.
        renderer: "canvaskit",
        canvasKitBaseUrl: "canvaskit/",
      },
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        // Only now is there something to look at.
        document.getElementById("boot")?.remove();
        // The engine replaces the viewport meta with its own, which pins
        // maximum-scale and sets user-scalable=no. This page is a scrolling
        // document, not a gesture surface — pinch-zoom is the reader's, and
        // WCAG 1.4.4 says so. Put it back.
        document
          .querySelector("meta[flt-viewport]")
          ?.setAttribute(
            "content",
            "width=device-width, initial-scale=1, viewport-fit=cover"
          );
      },
    });
  </script>

  <noscript>
    <p style="padding: 32px">
      This page is built with Flutter Web and needs JavaScript.
      The full resume is available as plain HTML at
      <a href="resume.html">resume.html</a>.
    </p>
  </noscript>
</body>
</html>
