<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mridul Dhiman — software engineer. An interactive terminal-style portfolio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mridul-portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mridul Dhiman — Terminal Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- Match the app background so there's no white flash before Flutter boots. -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background-color: #0C0C0C; }
  </style>
</head>
<body>
  <!--
    Custom bootstrap so CanvasKit is loaded from the copy `flutter build web`
    already places in build/web/canvaskit/, rather than from gstatic.com.
    Keeps the whole app on one origin — no third-party CDN at runtime.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      config: {
        canvasKitBaseUrl: "canvaskit/",
      },
    });
  </script>
</body>
</html>
